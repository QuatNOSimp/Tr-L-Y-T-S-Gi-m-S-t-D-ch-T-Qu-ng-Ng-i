<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#medGrad)" filter="url(#shadow)" />
  
  <!-- Subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Inner Medical Cross Backdrop -->
  <g fill="#ffffff">
    <!-- Medical Cross with Rounded Edges -->
    <rect x="208" y="116" width="96" height="280" rx="36" />
    <rect x="116" y="208" width="280" height="96" rx="36" />
  </g>

  <!-- Centered Emerald Emblem -->
  <circle cx="256" cy="256" r="76" fill="#047857" />

  <!-- Heart Pulse ECG Line (White) -->
  <path d="M 196 256 L 224 256 L 238 226 L 254 290 L 270 236 L 282 266 L 292 256 L 316 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Little Golden Star / Sparkle of Excellence -->
  <circle cx="360" cy="152" r="14" fill="#fbbf24" />
</svg>
